services:
  - type: web
    name: spouse-pay-path
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
